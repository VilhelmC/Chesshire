<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover so the board can use the full width on a notched
			phone; the app's own padding keeps content out of the cutout. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1a1a19" />
		<meta
			name="description"
			content="Drills what happens when the book runs out: the move after the last one you memorised."
		/>
		<title>Chesshire — offbook chess trainer</title>

		<link rel="manifest" href="/Chesshire/manifest.webmanifest" />
		<!-- Two favicons, chosen by the browser. The tile takes the page colour
			in each, so the tab icon is the face emerging from the background
			rather than a dark sticker on a light page. -->
		<link
			rel="icon"
			href="/Chesshire/icon.svg"
			type="image/svg+xml"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			href="/Chesshire/icon-light.svg"
			type="image/svg+xml"
			media="(prefers-color-scheme: light)"
		/>
		<!-- Fallback for browsers that ignore `media` on an icon link. -->
		<link rel="icon" href="/Chesshire/icon-192.png" sizes="192x192" />
		<!-- iOS reads neither the manifest's icons nor its display mode. -->
		<link rel="apple-touch-icon" href="/Chesshire/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Chesshire" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script type="module" crossorigin src="/Chesshire/assets/index-DHP_R7qX.js"></script>
		<link rel="stylesheet" crossorigin href="/Chesshire/assets/index-95b9w7DZ.css">
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
