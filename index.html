<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover so the board can use the full width on a notched
			phone; the app's own padding keeps content out of the cutout. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1a1a19" />
		<meta
			name="description"
			content="Drills what happens when the book runs out: the move after the last one you memorised."
		/>
		<title>Chesshire — offbook chess trainer</title>

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" sizes="192x192" />
		<!-- iOS reads neither the manifest's icons nor its display mode. -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Chesshire" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
