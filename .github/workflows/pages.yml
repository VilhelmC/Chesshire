# Build and publish to GitHub Pages.
#
# The app is local-first and has no backend, so "deploy" is genuinely just
# copying dist/ to a static host. What this buys is https — without it a phone
# will not register a service worker, so there is no install and no offline.
#
# Published at https://<owner>.github.io/<repo>/, which is why BASE_PATH is set.
# Everything else derives its base from that one value.

name: Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# racing it. `cancel-in-progress: false` so a half-finished upload is not
# published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall that copies the Stockfish WASM into
      # public/engine/ — which is gitignored, so without this step the engine
      # is simply missing from the deploy.
      - run: npm ci

      - run: npm test

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages runs Jekyll over the upload unless told not to, and Jekyll drops
      # files and directories beginning with an underscore.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
